<svg width="1200" height="780" viewBox="0 0 1200 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dot pattern -->
    <pattern id="dot-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#cbd5e1" />
    </pattern>
    <!-- Standard Crisp Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <!-- Green Arrow -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <!-- Red Arrow -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <!-- Purple Arrow -->
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#5b21b6"/>
    </marker>

    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 26px; font-weight: 600; fill: #0f172a; letter-spacing: -0.4px; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; font-weight: 700; fill: #0f172a; letter-spacing: -0.2px; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 400; fill: #1e293b; line-height: 1.35; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
      .annotation { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 500; fill: #64748b; }
      .db-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .db-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; font-weight: 500; fill: #64748b; }
      .gate-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #713f12; }
    </style>
  </defs>

  <!-- Background with dot grid -->
  <rect width="1200" height="780" fill="#ffffff" />
  <rect width="1200" height="780" fill="url(#dot-grid)" />

  <!-- Titles -->
  <text x="600" y="48" text-anchor="middle" class="main-title">Here is how LedgerForge works:</text>
  <text x="600" y="70" text-anchor="middle" class="sub-title">Deterministic matching, advisory LLM reasoning, non-negotiable CFO safety guardrails, and human-in-the-loop governance</text>

  <!-- 1. Ingestion Engine -->
  <rect x="70" y="100" width="220" height="106" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="180" y="132" text-anchor="middle" class="card-title">1. Ingestion Engine</text>
  <text x="180" y="152" text-anchor="middle" class="card-desc">Parses Bank CSV/API &amp; General</text>
  <text x="180" y="167" text-anchor="middle" class="card-desc">Ledger records. Normalizes multi-</text>
  <text x="180" y="182" text-anchor="middle" class="card-desc">currency ISO codes, booking dates.</text>

  <!-- 2. Matching Engine -->
  <rect x="360" y="100" width="235" height="106" rx="5" fill="#d1f7d1" stroke="#86efac" stroke-width="1.5" />
  <text x="477" y="132" text-anchor="middle" class="card-title">2. Matching Engine</text>
  <text x="477" y="152" text-anchor="middle" class="card-desc">Deterministic rule-based exact matching</text>
  <text x="477" y="167" text-anchor="middle" class="card-desc">(Ref + Date + Amount) &amp; multi-field</text>
  <text x="477" y="182" text-anchor="middle" class="card-desc">proximity fuzzy scoring (TF-IDF &amp; date).</text>

  <!-- 3. Ambiguity Gate (Diamond) -->
  <rect x="655" y="123" width="60" height="60" rx="4" transform="rotate(45 685 153)" fill="#fef08a" stroke="#eab308" stroke-width="1.5" />
  <text x="685" y="150" text-anchor="middle" class="gate-lbl">Ambiguity</text>
  <text x="685" y="163" text-anchor="middle" class="gate-lbl">Gate</text>

  <!-- 4. LLM Specialist -->
  <rect x="780" y="100" width="250" height="106" rx="5" fill="#dedcff" stroke="#b8b3f8" stroke-width="1.5" />
  <rect x="860" y="108" width="90" height="15" rx="3" fill="#ede9fe" />
  <text x="905" y="119" text-anchor="middle" class="tag-text" fill="#4338ca">Advisory Only</text>
  <text x="905" y="142" text-anchor="middle" class="card-title">3. LLM Specialist</text>
  <text x="905" y="160" text-anchor="middle" class="card-desc">GPT-4o-mini reasons over ambiguous</text>
  <text x="905" y="174" text-anchor="middle" class="card-desc">candidates; generates diagnostic evidence</text>
  <text x="905" y="188" text-anchor="middle" class="card-desc">without final decision authority.</text>

  <!-- Database Cylinder (Precedents.db) -->
  <g transform="translate(60, 295)">
    <path d="M6 28 V86 C6 98 25 108 48 108 C71 108 90 98 90 86 V28" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
    <ellipse cx="48" cy="28" rx="42" ry="17" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
    <text x="48" y="65" text-anchor="middle" class="db-title">Precedents</text>
    <text x="48" y="79" text-anchor="middle" class="db-sub">.db (Feedback)</text>
  </g>

  <!-- 5. Accountant Review -->
  <rect x="215" y="295" width="245" height="120" rx="5" fill="#ffd4d4" stroke="#fda4af" stroke-width="1.5" />
  <rect x="282" y="303" width="110" height="15" rx="3" fill="#fecdd3" />
  <text x="337" y="314" text-anchor="middle" class="tag-text" fill="#9f1239">Exception Queue</text>
  <text x="337" y="337" text-anchor="middle" class="card-title">5. Accountant Review</text>
  <text x="337" y="356" text-anchor="middle" class="card-desc">Auditor inspects exceptions in drawer,</text>
  <text x="337" y="371" text-anchor="middle" class="card-desc">chooses from 11 structured resolutions</text>
  <text x="337" y="386" text-anchor="middle" class="card-desc">(Bank Fee, Timing Diff, Re-match), notes.</text>

  <!-- 6. Decision Engine -->
  <rect x="540" y="295" width="250" height="120" rx="5" fill="#ffe6c7" stroke="#fdba74" stroke-width="1.5" />
  <rect x="605" y="303" width="120" height="15" rx="3" fill="#fee2e2" />
  <text x="665" y="314" text-anchor="middle" class="tag-text" fill="#991b1b">Supreme Authority</text>
  <text x="665" y="337" text-anchor="middle" class="card-title">4. Decision Engine</text>
  <text x="665" y="356" text-anchor="middle" class="card-desc">Enforces policy checks and hard safety</text>
  <text x="665" y="371" text-anchor="middle" class="card-desc">overrides: $0.05 material variance,</text>
  <text x="665" y="386" text-anchor="middle" class="card-desc">currency parity, duplicate locks, ambiguity.</text>

  <!-- 7. Straight-Through AUTO_RECONCILE -->
  <rect x="870" y="295" width="215" height="120" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5" />
  <rect x="922" y="303" width="110" height="15" rx="3" fill="#bbf7d0" />
  <text x="977" y="314" text-anchor="middle" class="tag-text" fill="#166534">Passed All Checks</text>
  <text x="977" y="337" text-anchor="middle" class="card-title">Straight-Through</text>
  <text x="977" y="356" text-anchor="middle" class="card-desc">Auto-reconciles high-confidence,</text>
  <text x="977" y="371" text-anchor="middle" class="card-desc">zero-variance transactions directly</text>
  <text x="977" y="386" text-anchor="middle" class="card-desc">into ERP ledger with audit log.</text>

  <!-- 8. Agent Policy Optimizer -->
  <rect x="310" y="515" width="265" height="114" rx="5" fill="#dedcff" stroke="#b8b3f8" stroke-width="1.5" />
  <rect x="375" y="523" width="135" height="15" rx="3" fill="#e0e7ff" />
  <text x="442" y="534" text-anchor="middle" class="tag-text" fill="#3730a3">Offline Benchmarking</text>
  <text x="442" y="557" text-anchor="middle" class="card-title">6. Agent Policy Optimizer</text>
  <text x="442" y="575" text-anchor="middle" class="card-desc">Analyzes failure autopsies and synthesizes</text>
  <text x="442" y="590" text-anchor="middle" class="card-desc">candidate matching specs. Evaluates on</text>
  <text x="442" y="605" text-anchor="middle" class="card-desc">regression suite; zero runtime mutation.</text>

  <!-- 9. CFO Policy Governance -->
  <rect x="655" y="515" width="265" height="114" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5" />
  <rect x="715" y="523" width="145" height="15" rx="3" fill="#ede9fe" />
  <text x="787" y="534" text-anchor="middle" class="tag-text" fill="#5b21b6">Auditor Transparency</text>
  <text x="787" y="557" text-anchor="middle" class="card-title">7. CFO Policy Governance</text>
  <text x="787" y="575" text-anchor="middle" class="card-desc">Live transparency into active decision</text>
  <text x="787" y="590" text-anchor="middle" class="card-desc">thresholds and safety boundaries. Requires</text>
  <text x="787" y="605" text-anchor="middle" class="card-desc">explicit human promotion of candidates.</text>

  <!-- Connectors & Arrows -->
  <!-- 1. Ingestion -> Matching -->
  <path d="M 290 153 L 354 153" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 2. Precedents -> Matching (reads) -->
  <path d="M 125 295 L 358 195" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 5" />
  <circle cx="125" cy="295" r="3.8" fill="#ffffff" stroke="#475569" stroke-width="1.6" />
  <circle cx="358" cy="195" r="3.8" fill="#ffffff" stroke="#475569" stroke-width="1.6" />
  <text x="210" y="246" class="annotation" transform="rotate(-23 210 246)">reads precedents</text>

  <!-- 3. Matching -> Ambiguity Gate -->
  <path d="M 595 153 L 650 153" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 4. Ambiguity Gate -> LLM Specialist (Ambiguous) -->
  <path d="M 718 153 L 774 153" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="746" y="144" text-anchor="middle" class="annotation" fill="#4338ca" font-weight="600">Ambiguous</text>

  <!-- 5. Ambiguity Gate -> Decision Engine (Clear Match) -->
  <path d="M 685 186 L 685 289" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-green)" />
  <text x="724" y="235" text-anchor="middle" class="annotation" fill="#15803d" font-weight="600">Clear Match</text>

  <!-- 6. LLM Specialist -> Decision Engine (Advisory Proposal) -->
  <path d="M 880 206 L 755 290" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="840" y="245" class="annotation" fill="#4338ca" font-weight="500" transform="rotate(-33 840 245)">Advisory proposal</text>

  <!-- 7. Decision Engine -> AUTO -->
  <path d="M 790 355 L 864 355" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="826" y="344" text-anchor="middle" class="annotation" fill="#16a34a" font-weight="700">AUTO</text>

  <!-- 8. Decision Engine -> Accountant Review (ESCALATE) -->
  <path d="M 540 355 L 466 355" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <text x="502" y="344" text-anchor="middle" class="annotation" fill="#dc2626" font-weight="700">ESCALATE</text>

  <!-- 9. Accountant Review -> Precedents (writes) -->
  <path d="M 215 355 L 160 355" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 5" />
  <circle cx="215" cy="355" r="3.8" fill="#ffffff" stroke="#475569" stroke-width="1.6" />
  <circle cx="160" cy="355" r="3.8" fill="#ffffff" stroke="#475569" stroke-width="1.6" />
  <text x="187" y="372" text-anchor="middle" class="annotation">writes</text>

  <!-- 10. Accountant Review -> Agent Optimizer (Failure patterns) -->
  <path d="M 335 415 L 410 509" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="345" y="465" class="annotation" transform="rotate(50 345 465)">Failure feedback</text>

  <!-- 11. Agent Optimizer -> CFO Policy Governance -->
  <path d="M 575 572 L 649 572" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="612" y="563" text-anchor="middle" class="annotation" fill="#4338ca" font-weight="500">Propose spec</text>

  <!-- 12. CFO Policy Governance -> Decision Engine (Promotion) -->
  <path d="M 750 515 L 685 420" stroke="#5b21b6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-purple)" />
  <text x="736" y="468" class="annotation" fill="#5b21b6" font-weight="600" transform="rotate(-55 736 468)">Human promotion</text>
</svg>
